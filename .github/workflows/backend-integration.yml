name: Backend integration
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: ['backend/**','sql/**','.github/workflows/backend-integration.yml']
  pull_request:
    branches: [ main ]
    paths: ['backend/**','sql/**','.github/workflows/backend-integration.yml']
concurrency: { group: eternal-backend-integration, cancel-in-progress: false }
jobs:
  integration:
    name: Reino + persistencia de partida
    runs-on: ubuntu-latest
    environment: eternal-sql
    env:
      DB_SERVER: ${{ secrets.ETERNAL_DB_SERVER }}
      DB_NAME: ${{ secrets.ETERNAL_DB_NAME }}
      DB_USER: ${{ secrets.ETERNAL_DB_USER }}
      DB_PASSWORD: ${{ secrets.ETERNAL_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: Instalar sqlcmd
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/24.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
      - name: Preparar SQL
        run: |
          for f in sql/001_mvp_reino_recursos_granja.sql sql/002_ci_reset_demo.sql sql/003_game_saves.sql; do /opt/mssql-tools18/bin/sqlcmd -S "$DB_SERVER" -d "$DB_NAME" -U "$DB_USER" -P "$DB_PASSWORD" -C -b -i "$f"; done
          /opt/mssql-tools18/bin/sqlcmd -S "$DB_SERVER" -d "$DB_NAME" -U "$DB_USER" -P "$DB_PASSWORD" -C -b -Q "DELETE FROM dbo.ec_game_saves WHERE PlayerId=N'ci-player'"
      - name: Compilar y arrancar
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: local
          DB_URL: jdbc:sqlserver://${{ secrets.ETERNAL_DB_SERVER }}:1433;databaseName=${{ secrets.ETERNAL_DB_NAME }};encrypt=true;trustServerCertificate=true
          DB_USER: ${{ secrets.ETERNAL_DB_USER }}
          DB_PASSWORD: ${{ secrets.ETERNAL_DB_PASSWORD }}
        run: |
          mvn -B package
          java -jar target/*.jar > /tmp/eternal-backend.log 2>&1 &
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null && exit 0; sleep 2; done
          cat /tmp/eternal-backend.log; exit 1
      - name: Probar guardado, carga y conflicto
        run: |
          curl --fail --silent http://127.0.0.1:8080/api/save/ci-player > /tmp/s0.json
          python3 -c "import json;d=json.load(open('/tmp/s0.json'));assert d['version']==0 and d['state']=='{}'"
          curl --fail --silent -X PUT http://127.0.0.1:8080/api/save/ci-player -H 'Content-Type: application/json' -d '{"state":"{\"phase\":8,\"castle\":14}","version":0}' > /tmp/s1.json
          python3 -c "import json;d=json.load(open('/tmp/s1.json'));assert d['version']==1 and 'castle' in d['state']"
          code=$(curl --silent -o /tmp/conflict.json -w '%{http_code}' -X PUT http://127.0.0.1:8080/api/save/ci-player -H 'Content-Type: application/json' -d '{"state":"{}","version":0}'); test "$code" = 409
          curl --fail --silent http://127.0.0.1:8080/api/save/ci-player > /tmp/reload.json
          python3 -c "import json;d=json.load(open('/tmp/reload.json'));assert d['version']==1 and 'castle' in d['state'];print('PERSISTENCIA FASE VIII OK')"
      - name: Verificar SQL
        run: /opt/mssql-tools18/bin/sqlcmd -S "$DB_SERVER" -d "$DB_NAME" -U "$DB_USER" -P "$DB_PASSWORD" -C -b -Q "IF NOT EXISTS(SELECT 1 FROM dbo.ec_game_saves WHERE PlayerId=N'ci-player' AND Version=1 AND ISJSON(StateJson)=1) THROW 51000,'Persistencia incorrecta',1; SELECT 'FASE VIII SQL OK' Resultado;"
      - if: failure()
        run: cat /tmp/eternal-backend.log || true
