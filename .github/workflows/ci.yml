name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  backend:
    name: Backend Java
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Compilar y probar backend
        run: mvn -B test
  frontend:
    name: Frontend UI + Fase II
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Compilar frontend
        run: npm run build
      - name: Jugar Fase II completa
        run: npm run test:phase2
      - name: Guardar captura Fase II
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eternal-fase-ii-captura
          path: frontend/e2e-artifacts/phase2-complete.png
          if-no-files-found: ignore
