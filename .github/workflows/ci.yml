name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  backend:
    name: Backend Java
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - run: mvn -B test
  frontend:
    name: Frontend UI + Fase VI
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run preview -- --host 127.0.0.1 > /tmp/eternal-vite.log 2>&1 &
      - run: for i in {1..30}; do curl -fsS http://127.0.0.1:4173/Eternal/ >/dev/null && exit 0; sleep 1; done; exit 1
      - name: Jugar Fase VI completa
        run: npm run test:phase6
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: eternal-fase-vi-captura, path: frontend/phase6-complete.png, if-no-files-found: error }
