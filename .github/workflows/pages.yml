name: Publicar y probar demo web

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        working-directory: frontend
        run: npm install
      - name: Compilar demo
        working-directory: frontend
        env:
          VITE_DEMO_MODE: 'true'
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

  playtest:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        working-directory: frontend
        run: npm install
      - name: Instalar navegador
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Esperar propagacion de Pages
        run: sleep 15
      - name: Jugar y verificar
        working-directory: frontend
        run: npm run test:e2e
      - name: Guardar capturas visuales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eternal-visual-playtest
          path: frontend/e2e-artifacts
          retention-days: 14
